name: Generate Teds V2 media assets

on:
  push:
    paths:
      - '.github/workflows/generate-teds-v1-assets.yml'

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate TedsWoodworking V2 images and video
        shell: bash
        run: |
          mkdir -p img video
          cat > /tmp/generate_teds_v2.py <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path

          assets = [
              ("Q7m2Vx9Kp4Nr6Ta.jpg","TEDSWOODWORKING REVIEWS","CUSTOMER EXPERIENCES",1200,630),
              ("L3p8Qv5Mx2Kr9Nb.jpg","WHAT BUYERS ASK","BEFORE PURCHASING",1200,630),
              ("R6n4Tq8Vz3Mp7Xa.jpg","CUSTOMER EXPERIENCE","PLAN LIBRARY OVERVIEW",1280,720),
              ("K2v9Mr5Qx7Np3Ta.jpg","16,000+ PLANS","ACCESS + SEARCH",1200,630),
              ("P8x3Nv6Rq2Mk7Tb.jpg","PROJECT DETAIL","CUT LISTS + DRAWINGS",1200,630),
              ("T5q9Kx2Vm7Rp4Na.jpg","100+ CATEGORIES","BEGINNER → ADVANCED",1200,630),
              ("M4r7Vz3Qp8Nx2Ka.jpg","VALUE CHECK","$67 LIFETIME ACCESS",1200,630),
              ("X9p2Mq6Vr4Kt7Nb.jpg","PURCHASE PROTECTION","60-DAY GUARANTEE",1200,630),
              ("N6v3Rx8Kq5Mp2Ta.jpg","BONUS TOOLS","CAD + 150 VIDEOS",1200,630),
              ("B7q4Nv9Tx2Mr6Ka.jpg","CUSTOMER REVIEWS","WHAT YOU RECEIVE",1200,630),
              ("C3m8Vp5Qr7Nx2Tb.jpg","TEDSWOODWORKING","REVIEWS 2026",1200,630),
              ("H5x9Kq3Mv6Rp2Na.jpg","BUYER CHECKLIST","PLANS • ACCESS • VALUE",1200,630),
          ]

          bold='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          reg='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          out=Path('img')

          for idx,(name,headline,sub,W,H) in enumerate(assets):
              img=Image.new('RGB',(W,H),(37,31,24))
              d=ImageDraw.Draw(img,'RGBA')
              for y in range(0,H,18):
                  v=34 + ((y//18 + idx*5) % 20)
                  d.rectangle((0,y,W,min(H,y+18)),fill=(v+22,v+9,max(12,v-6),255))
              d.rounded_rectangle((55,55,W-55,H-55),radius=34,fill=(10,20,30,228),outline=(231,190,102,120),width=3)
              for k in range(5):
                  yy=165+k*52
                  d.line((int(W*.58),yy,W-120,yy),fill=(124,184,214,85),width=2)
              d.rectangle((int(W*.66),195,int(W*.86),385),outline=(124,184,214,145),width=4)
              d.line((int(W*.66),195,int(W*.86),385),fill=(124,184,214,120),width=2)
              d.line((int(W*.86),195,int(W*.66),385),fill=(124,184,214,120),width=2)
              f1=ImageFont.truetype(bold,58 if W==1200 else 62)
              f2=ImageFont.truetype(bold,34)
              f3=ImageFont.truetype(reg,22)
              d.text((95,105),headline,font=f1,fill=(255,246,229,255))
              d.text((98,200),sub,font=f2,fill=(244,190,83,255))
              d.text((98,H-130),'Independent review • Buyer questions • Offer details',font=f3,fill=(211,221,226,220))
              d.rounded_rectangle((98,H-82,365,H-40),radius=18,fill=(244,180,61,235))
              d.text((118,H-74),'TEDSWOODWORKING',font=ImageFont.truetype(bold,20),fill=(20,20,20,255))
              img.save(out/name,quality=35,optimize=True,progressive=True)
          PY
          python /tmp/generate_teds_v2.py

          ffmpeg -y -loglevel error -loop 1 -framerate 1             -i img/R6n4Tq8Vz3Mp7Xa.jpg -t 769             -vf 'scale=640:360,format=yuv420p'             -c:v libx264 -preset ultrafast -tune stillimage -crf 45             -movflags +faststart video/ROP3J7NXMZ4SHLWL3.mp4

          for f in             Q7m2Vx9Kp4Nr6Ta.jpg L3p8Qv5Mx2Kr9Nb.jpg R6n4Tq8Vz3Mp7Xa.jpg K2v9Mr5Qx7Np3Ta.jpg             P8x3Nv6Rq2Mk7Tb.jpg T5q9Kx2Vm7Rp4Na.jpg M4r7Vz3Qp8Nx2Ka.jpg X9p2Mq6Vr4Kt7Nb.jpg             N6v3Rx8Kq5Mp2Ta.jpg B7q4Nv9Tx2Mr6Ka.jpg C3m8Vp5Qr7Nx2Tb.jpg H5x9Kq3Mv6Rp2Na.jpg; do
            test -s "img/$f"
          done
          test -s video/ROP3J7NXMZ4SHLWL3.mp4
          duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 video/ROP3J7NXMZ4SHLWL3.mp4)"
          python - "$duration" <<'PY'
          import sys
          d=float(sys.argv[1])
          assert 768 <= d <= 770, d
          PY

      - name: Commit generated assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             img/Q7m2Vx9Kp4Nr6Ta.jpg             img/L3p8Qv5Mx2Kr9Nb.jpg             img/R6n4Tq8Vz3Mp7Xa.jpg             img/K2v9Mr5Qx7Np3Ta.jpg             img/P8x3Nv6Rq2Mk7Tb.jpg             img/T5q9Kx2Vm7Rp4Na.jpg             img/M4r7Vz3Qp8Nx2Ka.jpg             img/X9p2Mq6Vr4Kt7Nb.jpg             img/N6v3Rx8Kq5Mp2Ta.jpg             img/B7q4Nv9Tx2Mr6Ka.jpg             img/C3m8Vp5Qr7Nx2Tb.jpg             img/H5x9Kq3Mv6Rp2Na.jpg             video/ROP3J7NXMZ4SHLWL3.mp4
          if git diff --cached --quiet; then
            echo "Assets already exist; nothing to commit."
          else
            git commit -m "Generate TedsWoodworking V2 media assets"
            git push origin HEAD:main
          fi

# trigger-2026-11-14-v2
