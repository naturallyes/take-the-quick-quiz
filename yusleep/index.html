<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YuSleep</title>

  <meta name="robots" content="noindex, nofollow">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      color: #1f2937;
    }

    .loading-box {
      width: 90%;
      max-width: 420px;
      text-align: center;
      padding: 40px 24px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 30px;
      font-weight: 700;
    }

    p {
      margin: 0 0 28px;
      font-size: 16px;
      line-height: 1.5;
      color: #6b7280;
    }

    .spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 28px;
      border: 4px solid #e5e7eb;
      border-top-color: #111827;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .fallback {
      font-size: 14px;
      color: #9ca3af;
    }

    .fallback a {
      color: #374151;
      font-weight: 600;
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <main class="loading-box">
    <h1>YuSleep</h1>

    <p>Opening the YuSleep website...</p>

    <div class="spinner"></div>

    <div class="fallback">
      Not redirected?
      <a
        id="continue-link"
        href="https://getyusleep.com?&amp;shield=3c1650uziu2wo7fuyps9k9fsdd&amp;traffic_source=yt&amp;campaign=nazar&amp;creative=img1&amp;ad=vid1"
        rel="nofollow sponsored"
      >
        Continue here
      </a>
    </div>
  </main>

  <script>
    const affiliateUrl =
      "https://getyusleep.com?&shield=3c1650uziu2wo7fuyps9k9fsdd&traffic_source=yt&campaign=nazar&creative=img1&ad=vid1";

    setTimeout(function () {
      window.location.replace(affiliateUrl);
    }, 1400);
  </script>

</body>
</html>
