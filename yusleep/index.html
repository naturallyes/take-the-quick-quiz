<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YuSleep</title>

  <meta name="robots" content="noindex, nofollow">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      color: #ffffff;

      background:
        radial-gradient(
          circle at 20% 15%,
          rgba(86, 115, 255, 0.22),
          transparent 34%
        ),
        radial-gradient(
          circle at 85% 82%,
          rgba(106, 72, 255, 0.18),
          transparent 36%
        ),
        linear-gradient(
          145deg,
          #07101f 0%,
          #0b1222 45%,
          #11182b 100%
        );
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;

      background:
        linear-gradient(
          rgba(255, 255, 255, 0.012) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.012) 1px,
          transparent 1px
        );

      background-size: 40px 40px;
      pointer-events: none;
    }

    .ambient {
      position: fixed;
      width: 260px;
      height: 260px;
      border-radius: 50%;

      background: rgba(95, 105, 255, 0.18);
      filter: blur(70px);

      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);

      pointer-events: none;
    }

    .card {
      position: relative;

      width: calc(100% - 34px);
      max-width: 430px;

      padding: 38px 28px 30px;

      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 28px;

      background: rgba(255, 255, 255, 0.065);

      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.34),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      text-align: center;

      animation: cardIn 0.55s ease-out both;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      margin-bottom: 22px;
      padding: 8px 12px;

      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 999px;

      background: rgba(255, 255, 255, 0.055);

      color: rgba(255, 255, 255, 0.72);

      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #7d8cff;

      box-shadow:
        0 0 0 4px rgba(125, 140, 255, 0.10),
        0 0 18px rgba(125, 140, 255, 0.65);

      animation: pulse 1.2s ease-in-out infinite;
    }

    h1 {
      margin-bottom: 10px;

      font-size: clamp(36px, 9vw, 48px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.045em;
    }

    .subtitle {
      max-width: 320px;
      margin: 0 auto 28px;

      color: rgba(255, 255, 255, 0.64);

      font-size: 15px;
      line-height: 1.55;
    }

    .progress-wrap {
      width: 100%;
      height: 7px;

      overflow: hidden;

      margin-bottom: 18px;

      border-radius: 999px;

      background: rgba(255, 255, 255, 0.08);
    }

    .progress-bar {
      width: 0;
      height: 100%;

      border-radius: inherit;

      background:
        linear-gradient(
          90deg,
          #7c83ff 0%,
          #a78bfa 52%,
          #82a8ff 100%
        );

      box-shadow:
        0 0 22px rgba(130, 145, 255, 0.45);

      animation: loading 1.4s cubic-bezier(.22,.8,.35,1) forwards;
    }

    .verification {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      margin-bottom: 26px;

      color: rgba(255, 255, 255, 0.55);

      font-size: 13px;
    }

    .check {
      width: 18px;
      height: 18px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: rgba(115, 235, 176, 0.12);
      color: #87e6b4;

      font-size: 11px;
      font-weight: 900;
    }

    .fallback {
      padding-top: 20px;

      border-top: 1px solid rgba(255, 255, 255, 0.08);

      color: rgba(255, 255, 255, 0.38);

      font-size: 12px;
    }

    .fallback a {
      margin-left: 4px;

      color: rgba(255, 255, 255, 0.78);

      font-weight: 650;
      text-decoration: none;
    }

    .fallback a:hover,
    .fallback a:focus {
      text-decoration: underline;
    }

    @keyframes loading {
      0% {
        width: 7%;
      }

      58% {
        width: 72%;
      }

      82% {
        width: 88%;
      }

      100% {
        width: 100%;
      }
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 0.7;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.12);
      }
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.985);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 480px) {
      .card {
        padding: 34px 22px 27px;
        border-radius: 24px;
      }

      .subtitle {
        font-size: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card,
      .status-dot,
      .progress-bar {
        animation: none;
      }

      .progress-bar {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="ambient"></div>

  <main class="card">

    <div class="status-pill">
      <span class="status-dot"></span>
      Secure Redirect
    </div>

    <h1>YuSleep</h1>

    <p class="subtitle">
      Opening the official YuSleep website
    </p>

    <div
      class="progress-wrap"
      aria-label="Loading"
    >
      <div class="progress-bar"></div>
    </div>

    <div class="verification">
      <span class="check">✓</span>
      Official website
    </div>

    <div class="fallback">
      Taking you there securely.
      <a
        href="https://getyusleep.com?&amp;shield=3c1650uziu2wo7fuyps9k9fsdd&amp;traffic_source=yt&amp;campaign=nazar&amp;creative=img1&amp;ad=vid1"
        rel="nofollow sponsored"
      >
        Continue now
      </a>
    </div>

  </main>

  <script>
    const affiliateUrl =
      "https://getyusleep.com?&shield=3c1650uziu2wo7fuyps9k9fsdd&traffic_source=yt&campaign=nazar&creative=img1&ad=vid1";

    setTimeout(function () {
      window.location.replace(affiliateUrl);
    }, 1400);
  </script>

</body>
</html>
